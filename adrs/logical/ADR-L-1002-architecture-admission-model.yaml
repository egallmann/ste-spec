invariants:
- id: 01a04e96-1f5c-7a9f-940f-570e0ffed0bb
  statement: 'Admission input closure MUST include validated Architecture IR slice
    (or compiled IR

    handle), evidence bundle reference, governance posture, active ruleset identity,

    requested_action, environment, and evaluation scope sufficient to reproduce the
    decision.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Reproducible admission requires explicit inputs aligned with ADR-L-1009
    determinism invariant.

    '
  alias_id: INV-5011
  alias_name: inv-5011
- id: 01a04e96-1f5c-7a98-963e-7b7199d3c6a2
  statement: 'DENY and CONDITIONAL outcomes MUST NOT be represented as successful
    boot or successful

    unvalidated IR consumption.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Preserves separation between IR validation/boot integrity and policy-layer
    admission outcomes.

    '
  alias_id: INV-5012
  alias_name: inv-5012
gaps: []
