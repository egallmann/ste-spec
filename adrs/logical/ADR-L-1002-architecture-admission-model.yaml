schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5c-73c9-ad1f-df05ef43cae1
title: Architecture Admission Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
- admission
tags:
- admission
- allow
- deny
context: 'Admission decides whether a **requested action** may proceed under declared

  architecture truth (IR), factual evidence, governance posture, and active rules.

  This ADR-L defines the semantic meaning of allowed, denied, conditional, and warned

  admission postures and the **input closure** required to reach a decision.


  IR validation versus admission evaluation follows ADR-031 and the STE kernel execution

  model: invalid IR is a boot/integration failure surface, not a disguised policy
  waiver.

  '
decisions:
- id: 01a04e96-1f5c-782e-8536-94c023b9f672
  summary: Treat admission as evaluation of requested_action in context
  rationale: 'Aligns all admission semantics with ADR-L-1001; forbids abstract system-only
    checks.

    '
  alias_id: DEC-6211
  alias_name: treat-admission-as-evaluation-of-requested-action-in-context
- id: 01a04e96-1f5c-7c3c-883d-59b691cc355e
  summary: Separate IR validation failure semantics from policy denial semantics
  rationale: 'Preserves fail-closed boot while keeping admission outcomes honest for
    policy layers.

    '
  alias_id: DEC-6212
  alias_name: separate-ir-validation-failure-semantics-from-policy-denial-semantics
related_adrs:
- 01a04e96-1f5c-7eef-9c36-e3ff0be7a77d
