decisions:
- id: 01a04e96-1f5a-7651-9f39-0111d413d813
  summary: Gateway holds ORG-scoped enforcement authority, not ORG attestation authority
  rationale: 'Gateway verifies signatures and enforces constraints using ORG-signed
    canonical

    material; it does not mint canonical artifacts, populate trust registries, or
    sign

    eligibility decisions as durable truth.

    '
  consequences:
    positive:
    - Clear separation of verification vs attestation
    negative:
    - Implementations cannot use Gateway keys as ORG signing keys
  alias_id: DEC-1901
  alias_name: gateway-holds-org-scoped-enforcement-authority-not-org-attestation-authority
- id: 01a04e96-1f5a-719f-b33a-11ca789d846a
  summary: Treat execution eligibility outcomes as ephemeral, unsigned enforcement
    results
  rationale: 'Eligibility answers are short-lived, derived deterministically from
    signed inputs, and

    logged for audit without becoming canonical attestations.

    '
  consequences:
    positive:
    - Avoids false equivalence with immutable canonical state
    negative:
    - Consumers cannot treat eligibility receipts as long-lived proofs without context
  alias_id: DEC-1902
  alias_name: treat-execution-eligibility-outcomes-as-ephemeral-unsigned-enforcement-results
invariants:
- id: 01a04e96-1f5a-7816-8927-f4d57777ac40
  statement: 'The Gateway MUST NOT sign canonical artifacts or eligibility outcomes
    as substitutes

    for ORG attestation of canonical truth.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves authority scarcity and non-repudiation semantics for canonical
    publishers.

    '
  upheld_by_decisions:
