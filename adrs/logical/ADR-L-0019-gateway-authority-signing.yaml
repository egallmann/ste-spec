context: 'STE Gateway verifies ORG-signed inputs and enforces eligibility; it does
  **not** attest

  canonical truth or sign canonical artifacts. Eligibility outcomes are ephemeral
  and

  unsigned.


  Legacy: `adrs/published/ADR-019-gateway-authority-signing.md`.


  **Reconciliation vs ADR-L-100x:** **coexist-with-precedence** — **ADR-L-1009** kernel

  decision contract and **ADR-L-1002** admission semantics govern STE-wide kernel

  narratives; this ADR pins **gateway signing and attestation boundaries** for the
  STE

  system model. On overlap, document precedence in consuming specs (e.g. execution
  model).

  '
