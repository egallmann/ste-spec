decisions:
- id: 01a04e96-1f5c-7024-b519-f8e876b25577
  summary: Require public, independently verifiable interfaces for handoff artifacts
    while allowing proprietary intelligence behind those surfaces
  rationale: 'Enables third-party compatibility without leaking proprietary leverage
    into public contracts.

    '
  consequences:
    positive:
    - Clear public versus private architectural split
    negative:
    - Interfaces must be maintained with discipline
  alias_id: DEC-4201
  alias_name: public-interface-closed-intelligence
invariants:
- id: 01a04e96-1f5c-7e13-8837-12e15900749f
  statement: 'New capabilities MUST be classified explicitly as public specification,
    interface-only

    publication, or closed implementation per this boundary before expanding ste-spec
    contracts.

    '
  scope: global
  enforcement_level: should
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Operationalizes downstream planning checks described in the legacy document.

    '
