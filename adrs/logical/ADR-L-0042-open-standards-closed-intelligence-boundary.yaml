context: 'STE adopts **open standards plus closed intelligence**: public specifications
  define

  compatible artifact formats, schemas, interfaces, and deterministic validation surfaces;

  proprietary reasoning may remain behind those interfaces.


  Legacy: `adrs/published/ARCHITECTURE_BOUNDARY_DECISION.md` (non-numbered published
  note).


  **Reconciliation vs supporting architecture notes:** **coexist-with-precedence**
  — see

  `architecture/OPEN_CLOSED_BOUNDARY.md` and related architecture notes for expanded
  prose;

  this ADR-L captures the **binding boundary decision** in machine form.

  '
