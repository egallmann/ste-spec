decisions:
- id: 01a04e96-1f5b-7ab5-a23e-7d058a2440e5
  summary: Gateway is not a Trust Registry principal and performs per-request trust
    verification
  rationale: 'Avoids self-referential trust entries and ensures revocations and expirations
    are

    respected at evaluation time.

    '
  consequences:
    positive:
    - Contemporaneous trust decisions
    negative:
    - Higher verification load per request
  alias_id: DEC-2101
  alias_name: gateway-is-not-a-trust-registry-principal-and-performs-per-request-trust-verification
- id: 01a04e96-1f5b-74f3-9627-58e2ffccb168
  summary: Fail closed when the Trust Registry is unavailable; bootstrap keys only
    verify the registry; cache cannot authorize execution
  rationale: 'Prevents stale or offline trust from authorizing execution; read-only
    degraded modes

    must be explicitly non-authoritative.

    '
  consequences:
    positive:
    - Stronger security posture
    negative:
    - Availability coupling to registry health
  alias_id: DEC-2102
  alias_name: trust-registry-unavailable-fail-closed
invariants:
- id: 01a04e96-1f5b-7b06-9b3d-3e00ff8dd8a3
  statement: 'Cached trust material MUST NOT be used to approve execution eligibility;
    if used for

    read-only paths, outputs MUST be marked non-authoritative and canonical promotion
    MUST

    be blocked.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Mitigates revocation and staleness attacks.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-74f3-9627-58e2ffccb168
  alias_id: INV-2101
  alias_name: inv-2101
gaps:
