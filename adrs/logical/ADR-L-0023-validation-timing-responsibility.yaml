- ste-spec
domains:
- gateway
- validation
tags:
- lifecycle
- eligibility
context: 'Validation occurs at merge-time (ADF), pre-execution (Gateway), and locally
  (Runtime).

  Only Gateway may authorize execution; ADF blocks canonical promotion; Runtime checks
  are

  advisory for eligibility. Normalized outcomes treat INDETERMINATE as blocking for

  authoritative paths.


  Legacy: `adrs/published/ADR-023-validation-timing-responsibility.md`.


  **Reconciliation vs ADR-L-100x:** **coexist-with-precedence** — **ADR-L-1002** admission

  semantics and **ADR-L-1009** caller contracts apply at the kernel documentation
  boundary;

  this ADR assigns **STE-system component responsibilities** for validation stages.


  **Reconciliation vs ADR-L-0026:** Gateway normative conflict handling is **verification
  of

  Fabric-attested conflict status**, not independent content parsing (see ADR-L-0026).

  '
