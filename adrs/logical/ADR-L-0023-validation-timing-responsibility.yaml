decisions:
- id: 01a04e96-1f5b-7222-9a3f-ba1e5cd25968
  summary: Assign ADF merge-time validation to canonical promotion blocking only;
    Gateway sole execution approval; Runtime local checks advisory only
  rationale: 'Prevents Runtime self-approval and clarifies layered enforcement.

    '
  consequences:
    positive:
    - Single authoritative execution gate
    negative:
    - Runtime cannot substitute for Gateway
  alias_id: DEC-2301
  alias_name: adf-gateway-validation-roles
- id: 01a04e96-1f5b-7fa3-ab0b-269953557d8c
  summary: Normalize validation outcomes; treat INDETERMINATE as FAIL for execution
    eligibility and canonical promotion
  rationale: 'Eliminates ambiguous partial success for authoritative transitions.

    '
  consequences:
    positive:
    - Aligns with fail-closed posture
    negative:
    - Transient validation issues block promotion or execution
  alias_id: DEC-2302
  alias_name: indeterminate-validation-fails
- id: 01a04e96-1f5b-7141-923d-c0c6841456b8
  summary: Require normative invariant conflict verification at Gateway during eligibility;
    allow optional preventative detection at ADF merge-time
  rationale: 'Gateway remains the definitive enforcement boundary; ADF may fail fast
    before publication.

    '
  consequences:
    positive:
    - Clear normative vs preventative split
    negative:
    - Algorithmic detail delegated to Fabric attestation model (ADR-L-0026)
  alias_id: DEC-2303
  alias_name: gateway-invariant-conflict-verification
invariants:
- id: 01a04e96-1f5b-732e-a30b-df7cb468dfa9
  statement: 'No component other than Gateway MAY treat local or merge-time validation
    success as

    sufficient to authorize execution eligibility when Gateway has not returned an
    explicit

    ALLOW outcome per contract.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves synchronous enforcement at the Gateway boundary.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7222-9a3f-ba1e5cd25968
  alias_id: INV-2301
  alias_name: inv-2301
gaps:
