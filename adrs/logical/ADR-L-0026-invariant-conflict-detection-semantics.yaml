decisions:
- id: 01a04e96-1f5b-7b70-990f-a7c17a31eed4
  summary: Define v1 conflict as duplicate canonical invariant identifiers with differing
    content digests within one Fabric Attestation scope
  rationale: 'Provides a mechanical, falsifiable conflict predicate without semantic
    theorem proving.

    '
  consequences:
    positive:
    - Deterministic detection in Fabric
    negative:
    - Semantic contradictions without ID collision remain out of scope for v1
  alias_id: DEC-2601
  alias_name: invariant-conflict-content-digest
- id: 01a04e96-1f5b-7e2a-893d-70c61ec4f8c4
  summary: Require signed `conflict_status` on Fabric Attestations; Gateway denies
    with INVARIANT_CONFLICT when status is detected; missing or invalid status fails
    closed
  rationale: 'Keeps Gateway in verifier-only posture while enforcing PREREQ-4 outcomes.

    '
  consequences:
    positive:
    - Stable denial category mapping
    negative:
    - Fabric must publish consistent attestation fields
  alias_id: DEC-2602
  alias_name: attestation-conflict-status
- id: 01a04e96-1f5b-7486-921f-710866e2aa23
  summary: Forbid Gateway-side conflict algorithms that parse or compare invariant
    content beyond attestation verification
  rationale: 'Prevents implementation divergence and hidden state discovery at the
    boundary.

    '
  consequences:
    positive:
    - Interoperable Gateway behavior
    negative:
    - Fabric bears detection responsibility
  alias_id: DEC-2603
  alias_name: gateway-conflict-algorithm-prohibition
invariants:
- id: 01a04e96-1f5b-78d8-823e-e464a03d787a
  statement: 'Gateway MUST NOT treat raw invariant payload comparison as authoritative
    for conflict

    detection; authoritative conflict signal is the signed Fabric `conflict_status`
    field.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Aligns verifier-only boundary with deterministic enforcement.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7e2a-893d-70c61ec4f8c4
  - 01a04e96-1f5b-7486-921f-710866e2aa23
  alias_id: INV-2601
  alias_name: inv-2601
gaps:
