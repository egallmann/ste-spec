decisions:
- id: 01a04e96-1f5a-7702-883d-6b265c2f46a9
  summary: Use deterministic extraction exclusively for generating architecture slices
    from source code
  rationale: 'Fabric will use deterministic extraction only for slice generation from
    source.

    Extractors parse code with language-native AST tooling and detect framework usage

    through explicit rules (illustrative examples in the legacy ADR: Python `ast.parse`,

    TypeScript Compiler API, JavaParser/JDT, `go/parser`; explicit patterns such as

    FastAPI/Express/Spring route decorators).


    Probabilistic matching is out of scope for graph construction: no embeddings for
    code

    similarity, no LLM inference for architectural relationships, no supervised ML
    for

    element typing in the extraction graph.

    '
  alternatives_considered:
  - name: LLM-based code understanding
    rejected_because: 'Non-deterministic outputs, hallucination risk, cost and latency
      at codebase scale,

      weak auditability for enterprise stakeholders who require explainable, repeatable

      extractions for critical documentation.

      '
  - name: Embedding-based similarity
    rejected_because: 'Similarity does not imply architectural dependency; threshold
      tuning is fragile;

      proximity does not explain why a link exists.

      '
  - name: Hybrid AST plus ML for ambiguity
    rejected_because: 'Dual systems increase maintenance and inconsistency (some slices
      deterministic,

      others probabilistic); ambiguity boundaries become arbitrary; explicit unknowns
      are

      preferable to incorrect inference.

      '
  - name: General-purpose static analysis tools as primary extractors
    rejected_because: 'Not designed for architecture slice taxonomy; insufficient
      metadata for slice model;

      heterogeneous per-language tooling; licensing constraints. Such tools may still
      feed

      inputs to custom extractors without becoming the primary extraction mechanism.

      '
  consequences:
    positive:
    - Identical source and extractor version yield identical outputs (regression testing,
      auditable reprocessing).
    - Every slice traces to file, line, and extractor logic (explainability).
    - No model drift, retraining, or GPU inference path for extraction graph construction.
    - Lower operational cost and faster extraction versus ML inference for graph edges.
    negative:
    - Cannot infer relationships absent observable patterns (dynamic loading, reflection,
      uncodified convention).
    - Per-language and per-framework extractor development and maintenance burden.
    - Ambiguity yields explicit unknowns rather than guessed edges; dynamic systems
      may look incomplete without manual assertions.
    - Mainstream framework coverage is easiest; niche or legacy stacks need bespoke
      extractors.
  alias_id: DEC-0101
  alias_name: use-deterministic-extraction-exclusively-for-generating-architecture-slices-from-source-code
- id: 01a04e96-1f5a-7594-a63f-e35090b4aa24
  summary: Optional natural-language query translation may use an LLM as a one-way
    query translator
  rationale: 'An intelligence service MAY translate natural language into structured
    queries using an

    LLM. The LLM sees the query (and metadata needed for translation), not extraction

    results, and translation is one-way into a structured query with fail-closed fallback

    when translation fails. This boundary keeps slice construction deterministic while

    allowing conversational interfaces upstream of structured retrieval.

    '
  consequences:
    positive:
    - Structured query path remains deterministic; LLM is not an extractor for graph
      edges.
    negative:
    - Translation quality and availability still depend on the NL translation component
      and must fail closed.
  alias_id: DEC-0102
  alias_name: optional-natural-language-query-translation-may-use-an-llm-as-a-one-way-query-translator
invariants:
- id: 01a04e96-1f5a-7a59-9e1b-7368051b9f9e
  statement: 'Architecture slice generation from source code MUST be deterministic:
    identical inputs

    (source artifacts, extractor configuration, extractor version) MUST produce

    identical slice outputs.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Enables regression tests, auditability, and confident reprocessing when
    extractor logic improves.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7702-883d-6b265c2f46a9
  alias_id: INV-0101
  alias_name: inv-0101
- id: 01a04e96-1f5a-7fee-b02f-0a03c41fa924
  statement: 'Extractors MUST use language-native parsing and explicit pattern rules
    for framework

    and API detection; they MUST produce identical outputs for identical inputs per
    INV-0101.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'Implements the concrete extractor discipline implied by deterministic
    extraction.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7702-883d-6b265c2f46a9
  alias_id: INV-0102
  alias_name: inv-0102
- id: 01a04e96-1f5a-78fc-ac37-5d69fdb35439
  statement: 'The extraction graph MUST NOT assert architectural relationships using
    embeddings,

    probabilistic models, or LLM inference over source code or extraction artifacts.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves auditability and prevents silent probabilistic graph mutation.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7702-883d-6b265c2f46a9
  alias_id: INV-0103
  alias_name: inv-0103
- id: 01a04e96-1f5a-7225-ac37-8631a3e857de
  statement: 'When an LLM participates in natural-language query translation, it MUST
    NOT receive

    extraction results as input for constructing or modifying architecture slices;
    failure

    to translate MUST fall back to structured query paths without inventing graph
    content.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: audit
  rationale: 'Keeps DEC-0102 compatible with deterministic slice authority.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7594-a63f-e35090b4aa24
  alias_id: INV-0104
  alias_name: inv-0104
- id: 01a04e96-1f5a-7d7f-a63b-839b2a82f7cb
  statement: 'When deterministic rules cannot observe a relationship or element, the
    system MUST

    record explicit unknowns per **ADR-L-0006** rather than inferring or guessing.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Aligns extraction behavior with explicit-unknown semantics and downstream
    truth contracts.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7702-883d-6b265c2f46a9
  alias_id: INV-0105
  alias_name: inv-0105
