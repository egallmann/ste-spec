decisions:
- id: 01a06490-5b3c-76c0-9da2-abc66f5c17e6
  summary: Govern computational reasoning as operation within an explicitly governed
    semantic outcome space
  rationale: Applicable authoritative semantics collectively shape acceptable outcomes
    by requiring, prohibiting, preferring, discouraging, or explicitly permitting
    outcomes while preserving separate authority and epistemic boundaries. FD-01
    governs what semantic outcome space reasoning may inhabit; CEM governs how
    bounded reasoning is conducted through its lifecycle; epistemic semantics
    govern what may legitimately be claimed as known; and authority semantics
    govern which semantics are competent to govern.
  consequences:
    positive:
    - Reasoning inputs and candidate acceptance have one explicit semantic boundary.
    - Multiple materially different outcomes can remain conformant when bounded.
    negative:
    - Higher-order semantic assessment remains evidence-bearing rather than theorem proof.
  alias_id: DEC-4401
  alias_name: govern-computational-reasoning-within-an-explicit-semantic-outcome-space
- id: 01a06490-5b3c-76c0-9da2-abc77292b641
  summary: Define deterministic AI reasoning as bounded-outcome determinism
  rationale: Determinism constrains the acceptable outcome space; it does not require
    one identical textual, procedural, or implementation result.
  consequences:
    positive:
    - Independent reasoners may produce materially different conformant outcomes.
    - Mechanical compilation and validation determinism remain separately expressible.
    negative:
    - Consumers must evaluate authority, normative, and epistemic boundaries.
  alias_id: DEC-4402
  alias_name: define-bounded-outcome-determinism-for-ai-reasoning
- id: 01a06490-5b3c-76c0-9da2-abc810701700
  summary: Use complementary prose and formal semantics when formal treatment materially
    improves precision or evaluability
  rationale: |
    Formal notation clarifies composition only when its assumptions and domain are
    locally interpretable and defensible. When used, the specification should state
    the plain-language claim, expression, symbol/operator definitions, plain-English
    reading, useful worked example, semantic boundary/non-claim, and validation
    consequence. Equations are not introduced for rhetorical effect; a challenged
    expression must have defensible assumptions, derivation, domain, and validity or
    be corrected, narrowed, or removed. For bounded reasoning, Ω denotes the
    candidate-outcome universe, H the applicable hard constraints, each h ∈ H
    induces A_h ⊆ Ω, and A = ⋂(h ∈ H) A_h is the hard-admissible outcome space.
    Preference may order members of A without excluding them; explicit permission
    identifies a permitted region. An empty A demonstrates non-convergence only
    where those hard semantics are mechanically reducible.
  consequences:
    positive:
    - Reducible semantic properties can expose mechanically evaluable consequences.
    negative:
    - Formal expressions require explicit definitions, assumptions, and challenge.
  alias_id: DEC-4403
  alias_name: use-complementary-prose-and-formal-semantics-when-materially-useful
- id: 01a06490-5b3c-76c0-9da2-abc922ef02dc
  summary: Admit NormativeProposition as a first-class semantic type and carrier for independently
    meaningful normative architectural propositions
  rationale: |
    Independently meaningful normative meaning needs an explicit carrier whose
    authority, force, scope, and provenance can be reasoned about without relying on
    document position or modal wording alone. For ADR-scoped NPs, current authority
    derives from presence in the effective authoritative ADR revision; no independent
    NP governance lifecycle is required; removal removes current authority while
    historical revisions preserve prior state. Tombstones and mandatory
    supersedes/refines/coalescence lineage are not inherently required. Materially
    changed meaning receives a new identity; editorial relocation or non-semantic
    wording change may retain identity. NormativeProposition remains distinct from
    Invariant, Rule, evidence, assessment, broad Constraint semantics, and future
    Requirement semantics.
  consequences:
    positive:
    - Normative meaning can be addressed and composed explicitly.
    - Existing ADR authority remains the source of current NP authority.
    negative:
    - Native authoring and normalized representation remain downstream work.
  alias_id: DEC-4404
  alias_name: admit-normativeproposition-as-a-first-class-semantic-carrier
- id: 01a06490-5b3c-76c0-9da2-abca4aa3eaa5
  summary: Preserve NormativeProposition and Invariant as peer semantic types
  rationale: Semantic type determines architectural meaning; modal strength, importance,
    scope, or model interpretation cannot silently perform cross-type evolution.
  consequences:
    positive:
    - Invariant, Rule, Constraint, evidence, assessment, and future Requirement remain distinct.
    negative:
    - Cross-type evolution requires substantive architecture review.
  alias_id: DEC-4405
  alias_name: preserve-normativeproposition-and-invariant-as-peer-semantic-types
- id: 01a06490-5b3c-76c0-9da2-abcb706d9c2f
  summary: Define global normative forces as MUST, MUST NOT, SHOULD, SHOULD NOT, and MAY
  rationale: |
    One carrier-invariant vocabulary supports human understanding, reasoner steering,
    semantic composition, and deterministic classification without a required polarity
    flag. MUST establishes hard positive admissibility; MUST NOT establishes hard
    exclusion; SHOULD is a strong positive expectation; SHOULD NOT is a strong negative
    expectation; and MAY is explicit strong permission. SHOULD/SHOULD NOT are not
    casual advice and permit defensible deviation without automatically making a
    candidate hard-nonconformant.
    MAY(P) implies absence of an applicable MUST NOT(P), but absence of MUST NOT(P)
    does not imply MAY(P). MAY can therefore record positive permission without
    enlarging the hard-admissible set.
  consequences:
    positive:
    - Hard admissibility, preference, and explicit freedom are distinguishable.
    - MAY can prevent over-constraint by recording positive permission.
    negative:
    - Exception, waiver, and conflict-resolution mechanics remain downstream.
  alias_id: DEC-4406
  alias_name: define-global-carrier-invariant-normative-forces
- id: 01a06490-5b3c-76c0-9da2-abccfd310a81
  summary: Separate normative force, authority, effectivity, and applicability
  rationale: |
    A proposition can be strongly expressed without being competent, effective, or
    applicable to a concrete case. Conceptually, G(p,d,t) holds iff an
    authority-bearing source s establishes proposition p, is effective at t, and has
    valid competence over bounded domain d at t. G is governing eligibility, not
    concrete applicability. STE-SPEC governs system-of-systems intent semantics and
    cross-system boundaries; local STE systems retain bounded intent authority inside
    those boundaries and MUST NOT manufacture competence over semantics reserved to
    STE-SPEC. Explicitly established or validly derived semantic relationships
    in an effective ADR corpus may compose, but plausible LLM inference alone does
    not become authority. Representation, persistence, normalization, projection,
    observation, inference, implementation, or graph structure do not manufacture
    architectural authority.
  consequences:
    positive:
    - Governing eligibility can be assessed without manufacturing authority.
    - Scope and applicability remain explicit semantic dimensions.
    negative:
    - Complete precedence and applicability schemas remain deferred.
  alias_id: DEC-4407
  alias_name: separate-force-authority-effectivity-and-applicability
- id: 01a06490-5b3c-76c0-9da2-abcd629744d2
  summary: Bound authority composition and delegation to legitimately possessed competence
  rationale: |
    Delegation may narrow competence but cannot amplify it; multiple authority paths
    cannot manufacture cross-domain competence through co-presence; unresolved
    competent/effective conflicts must remain visible rather than being ordered away
    by document order, ADR number, recency, modal strength, implementation state, or
    projection order. A future explicit composition rule may establish bounded
    cross-domain composition.
  consequences:
    positive:
    - Authority paths remain auditable and domain-bounded.
    negative:
    - A future explicit cross-domain composition rule may still be required.
  alias_id: DEC-4408
  alias_name: bound-authority-composition-and-delegation-to-possessed-competence
- id: 01a06490-5b3c-76c0-9da2-abcef9d0406f
  summary: Evaluate applicability with APPLIES, DOES_NOT_APPLY, and UNKNOWN outcomes
  rationale: |
    Scope bounds contexts in which governed meaning can potentially apply; it may be
    inherited and narrowed but must not broaden competence. Applicability evaluates
    already competent/effective meaning against a concrete context and must arise from
    declared or validly inherited scope/context semantics. Insufficient contextual
    knowledge must not be converted into a positive or negative applicability claim.
  consequences:
    positive:
    - Applicability remains grounded in declared or inherited scope and context.
    negative:
    - Detailed context assembly and task-specific reasoning selection remain separate.
  alias_id: DEC-4409
  alias_name: preserve-tristate-scope-and-applicability-outcomes
- id: 01a06490-5b3c-76c0-9da2-abcf1f4ae7a3
  summary: Preserve intent and embodiment as distinct competence domains
  rationale: Runtime and other embodiment systems may provide bounded observation,
    provenance, coverage, evidence, and assessment without acquiring architectural-intent authority.
  consequences:
    positive:
    - Intent/embodiment composition can support bounded assessment without authority union.
    negative:
    - Cross-domain linkage and verdict semantics require later governed decisions.
  alias_id: DEC-4410
  alias_name: preserve-distinct-intent-and-embodiment-competence-domains
invariants:
- id: 01a06490-5b3c-76c0-9da2-abd019c4eafa
  statement: 'A conforming reasoning outcome MUST remain within the applicable semantic,
    authority, normative, and epistemic boundaries; bounded-outcome determinism MUST
    NOT be interpreted as a requirement for one identical generated result.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Preserves governed reasoning-space shaping while allowing bounded outcome diversity.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc66f5c17e6
  alias_id: INV-4401
  alias_name: bounded-reasoning-outcomes-remain-within-applicable-boundaries
- id: 01a06490-5b3c-76c0-9da2-abd1988d0c47
  statement: 'STE MUST NOT introduce equations or formal notation merely for rhetorical
    effect, and every non-trivial formal expression MUST remain locally interpretable
    and defensible within its declared assumptions and domain.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: Mathematical notation does not confer authority or correctness.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc77292b641
  alias_id: INV-4402
  alias_name: formal-expressions-are-purposeful-local-and-defensible
- id: 01a06490-5b3c-76c0-9da2-abd248766fb3
  statement: 'A NormativeProposition MUST contain independently meaningful normative
    semantics whose explicit presence is materially capable of shaping the governed
    reasoning space; modal or imperative wording alone MUST NOT admit an NP.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: Admission materiality distinguishes semantic propositions from explanation,
    navigation, organization, and non-shaping restatement.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc922ef02dc
  alias_id: INV-4403
  alias_name: normativeproposition-admission-requires-semantic-materiality
- id: 01a06490-5b3c-76c0-9da2-abd3a0decf0a
  statement: 'Normative force MUST retain the same meaning across legitimate semantic
    carrier types and MUST NOT manufacture authority, effectivity, applicability, or
    epistemic knowledge.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Carrier type determines architectural meaning without redefining force semantics.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abcb706d9c2f
  - 01a06490-5b3c-76c0-9da2-abccfd310a81
  alias_id: INV-4404
  alias_name: normative-force-is-carrier-invariant-and-cannot-manufacture-authority
- id: 01a06490-5b3c-76c0-9da2-abd4898798ad
  statement: 'For applicable hard constraints H over candidate universe Ω, each h MUST
    induce an admissible subset A_h and the hard-admissible space MUST be understood
    conceptually as A = intersection of all A_h; materially different candidates MAY
    both conform when each is a member of A.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: |
    Makes hard admissibility, bounded determinism, and preference composition explicit
    without claiming all architecture is formally reducible. Where mechanically
    reducible hard semantics produce A = empty set, the bounded applicability context
    has no convergent candidate. Validation remains a continuum: deterministic
    contradiction checks, graph/rule evaluation for structured incompatibility, and
    bounded evidence-bearing semantic assessment for higher-order incompatibility.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc5d28f8970
  - 01a06490-5b3c-76c0-9da2-abc77292b641
  alias_id: INV-4405
  alias_name: hard-admissible-space-is-the-intersection-of-applicable-hard-constraints
- id: 01a06490-5b3c-76c0-9da2-abd5bcdb8c75
  statement: 'Preference semantics MUST order otherwise hard-admissible candidates
    without automatically removing a non-preferred candidate from the hard-admissible
    space, and MAY(P) MUST be distinguished from mere absence of MUST NOT(P). MAY(P)
    implies absence of an applicable MUST NOT(P), but absence of MUST NOT(P) does not
    imply MAY(P).'
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: Preserves strong preference and explicit permission as distinct roles.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc5d28f8970
  - 01a06490-5b3c-76c0-9da2-abc922ef02dc
  alias_id: INV-4406
  alias_name: preference-and-explicit-permission-remain-distinct-from-hard-admissibility
- id: 01a06490-5b3c-76c0-9da2-abd6c47b3056
  statement: 'Governing eligibility for proposition p over bounded domain d at relevant
    state or time t MUST require an authority-bearing source s that establishes p,
    is effective at t, and possesses valid competence over d at t; this eligibility
    relation MUST NOT be treated as concrete applicability. Representation,
    persistence, normalization, projection, observation, inference, implementation,
    or graph structure MUST NOT manufacture authority.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Separates authority path and effectivity from case-specific applicability.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abc810701700
  - 01a06490-5b3c-76c0-9da2-abc922ef02dc
  alias_id: INV-4407
  alias_name: governing-eligibility-requires-competent-effective-authority
- id: 01a06490-5b3c-76c0-9da2-abd7aacbfd63
  statement: 'Delegation MUST NOT amplify competence, co-present authority paths MUST
    NOT manufacture cross-domain competence, and unresolved conflicts among competent
    effective semantics MUST NOT be silently resolved by document order, recency,
    modal strength, implementation state, or projection order.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Authority composition remains bounded and divergence remains visible.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abcd629744d2
  alias_id: INV-4408
  alias_name: authority-delegation-cannot-amplify-competence-or-hide-conflict
- id: 01a06490-5b3c-76c0-9da2-abd8e8aad9dd
  statement: 'Applicability MUST yield APPLIES, DOES_NOT_APPLY, or UNKNOWN from declared
    or validly inherited scope and contextual semantics; insufficient contextual knowledge
    MUST remain UNKNOWN and MUST NOT be collapsed into either other outcome.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Prevents textual similarity, proximity, or model intuition from manufacturing
    governing meaning.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abcef9d0406f
  alias_id: INV-4409
  alias_name: applicability-preserves-tristate-unknown-semantics
- id: 01a06492-55f2-774e-a599-50ed40272e9c
  statement: 'Runtime and other embodiment systems MUST NOT manufacture architectural
    intent authority from observation, reconstruction, provenance, coverage, evidence,
    persistence, projection, or derived assessment; composition MUST NOT transfer or
    union the authorities of intent and embodiment inputs.'
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: Preserves the intent-versus-embodiment competence boundary.
  upheld_by_decisions:
  - 01a06490-5b3c-76c0-9da2-abcf1f4ae7a3
  alias_id: INV-4410
  alias_name: embodiment-cannot-manufacture-or-union-intent-authority
gaps:
- id: GAP-4401
  question: Native authoring and normalized representation for NormativeProposition
    remain downstream and must preserve this semantic contract.
  impact: medium
  blocking: false
- id: GAP-4402
  question: Detailed exception/waiver mechanics, complete authority-precedence algebra,
    detailed applicability schema, task-specific reasoning-state selection, complete
    canonical relationship ontology, intent/embodiment relationship vocabulary,
    convergence scoring, CEM lifecycle redesign, full epistemic composition, exact
    Requirement semantics, exact future Invariant representation, native ADR-Kit or
    Runtime NP implementation, and validator mechanics remain downstream.
  impact: medium
  blocking: false
