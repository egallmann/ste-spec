  statement: 'Extensions to mechanical Architecture IR enumerations MUST be ste-spec
    contract changes

    with pin discipline; semantic additions MAY land in ste-spec prose first with
    explicit

    realization notes.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves ADR-L-0035 as ontology and mechanical authority anchor.

