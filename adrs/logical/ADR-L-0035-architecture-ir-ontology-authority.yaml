decisions:
- id: 01a04e96-1f5c-7315-962f-572c86c75279
  summary: Keep semantic Architecture IR authority in ste-spec prose; keep mechanical
    schemas and pins in ste-spec contracts
  rationale: 'Prevents conflating JSON `kind` enums with the full ontology and avoids
    duplicate schema authority in kernel repos.

    '
  consequences:
    positive:
    - Single cross-repo vocabulary reference
    negative:
    - Requires disciplined ir_version and schema_id updates
  alias_id: DEC-3501
  alias_name: semantic-ir-authority
