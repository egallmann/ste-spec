id: 01a04e96-1f5c-7fd4-bf3e-ddca6103eae1
title: Architecture IR Ontology Authority in ste-spec
status: accepted
created_date: '2025-12-19'
modified_date: '2026-09-02'
authors:
- Erik Gallmann
- ste-spec
domains:
- architecture-ir
- contracts
tags:
- ontology
- semantics
context: '`architecture/STE-Architecture-Intermediate-Representation.md` is the canonical
  **semantic**

  specification of Architecture IR. Mechanical JSON Schema and compiled enumerations
  publish

  under `contracts/architecture-ir/` per the contract pin. ste-kernel consumes the
  bundle;

  it does not own normative mechanical definitions. Compiler roles are further constrained

  by ADR-L-0041.


  Legacy: `adrs/published/ADR-035-architecture-ir-ontology-authority.md`.


  **Reconciliation vs ADR-L-1006:** **coexist-with-precedence** — evidence authority
  governs

  evidentiary artifacts; this ADR governs **Architecture IR meaning** versus mechanical
  enums.

  **Reconciliation vs ADR-L-0044:** **coexist-with-precedence** — ADR-L-0044 establishes
  cross-cutting governed-reasoning and normative semantic meaning; this ADR remains the
  authority for semantic Architecture IR ontology and mechanical realization boundaries.
  No CE-01 identity or compiled IR identity change is implied.

  '
