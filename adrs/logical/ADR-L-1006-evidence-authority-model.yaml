invariants:
- id: 01a04e96-1f5d-7ec8-b43f-930c76aed494
  statement: 'Evidence MUST NOT be interpreted as normative architecture authority;
    overrides MUST

    flow from governance artifacts, not from raw observations alone.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Preserves documentation-state authority while still using factual runtime
    observations.

    '
  alias_id: INV-5051
  alias_name: inv-5051
