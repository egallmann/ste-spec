schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5d-78e4-b527-64a4a9e9e2b5
title: Evidence Authority Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
- evidence
tags:
- evidence
- authority
context: 'Runtime evidence is authoritative as **factual observation** within its
  contract, not as

  a replacement for normative architecture declared in ste-spec and documentation-state.

  When evidence contradicts IR or ADR meaning, the kernel MUST categorize contradiction
  as

  drift or assessment finding; it MUST NOT silently rewrite normative sources.


  Governance authority may authorize exceptions through explicit artifacts per ADR-040;

  raw runtime truth does not override architecture by default.

  '
decisions:
- id: 01a04e96-1f5c-7a27-a11f-75a40eb74970
  summary: Enumerate authoritative evidence sources by contract family
  rationale: 'Admission must know which observations count and under what provenance
    kinds.

    '
  alias_id: DEC-6651
  alias_name: enumerate-authoritative-evidence-sources-by-contract-family
- id: 01a04e96-1f5d-72db-8531-d6d6316b8dd1
  summary: Contradiction yields drift or assessment output, not silent IR mutation
  rationale: 'Preserves documentation-state authority and auditability.

    '
  alias_id: DEC-6652
  alias_name: contradiction-yields-drift-or-assessment-output-not-silent-ir-mutation
related_adrs:
- 01a04e96-1f5c-7b1e-943d-6db525f77bf0
