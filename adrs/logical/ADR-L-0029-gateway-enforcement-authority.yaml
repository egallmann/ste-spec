decisions:
- id: 01a04e96-1f5b-78f2-a72f-6f4b4c925fb3
  summary: Define Enforcement Authority as Gateway-specific verification and eligibility
    enforcement without canonical publishing or trust-registry mutation
  rationale: 'Removes contradiction between ORG signing requirements and Gateway verifier
    role.

    '
  consequences:
    positive:
    - Clear trust-registry schema direction
    negative:
    - Implementations must not label Gateway keys as ORG signing keys
  alias_id: DEC-2901
  alias_name: gateway-specific-enforcement-authority
- id: 01a04e96-1f5b-788d-9f3f-9966be81b702
  summary: Keep eligibility outcomes ephemeral and unsigned while retaining audit
    logs tied to signed inputs
  rationale: 'Avoids false equivalence between point-in-time enforcement and durable
    canonical truth.

    '
  consequences:
    positive:
    - Smaller long-lived signing surface
    negative:
    - Consumers cannot treat decisions as standalone attestations
  alias_id: DEC-2902
  alias_name: ephemeral-eligibility-audit-logs
invariants:
- id: 01a04e96-1f5b-7be7-8f0e-f05b133a9c34
  statement: 'Gateway MUST NOT be modeled as holding ORG attestation authority to
    sign canonical

    artifacts or Fabric Attestations; its authority is limited to verification and

    enforcement per ADR-L-0019 and ADR-L-0028.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves authority scarcity for canonical publishers.

    '
  upheld_by_decisions:
