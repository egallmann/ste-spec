schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5a-73a4-8e3f-bef43b56c052
title: Explicit Unknowns Over Inference
status: accepted
created_date: '2025-12-19'
modified_date: '2026-03-29'
authors:
- Erik Gallmann
- ste-spec
domains:
- extraction
- documentation-state
- recon
tags:
- unknowns
- transparency
- extraction
context: 'When extractors cannot fully determine relationships or properties, the
  system must not

  silently guess. This ADR-L encodes explicit **unknowns** alongside known facts.


  Legacy human projection: `adrs/published/ADR-006-explicit-unknowns.md`. Aligns with

  **ADR-L-0001** (deterministic extraction; unknowns when patterns are not observable).


  **Reconciliation vs ADR-L-100x:** **coexist-with-precedence** — kernel governance
  ADRs

  (1001–1009) govern admission and documentation-state authority at the STE kernel

  boundary; this ADR governs **Fabric extraction and slice truth** semantics. If a

  conflict appears, kernel governance precedes for **admission**, this ADR for **slice

  unknown recording** unless explicitly merged in a future ADR-L.

  '
related_adrs:
- 01a04e96-1f5a-765c-b22f-a35555c5da2c
decisions:
- id: 01a04e96-1f5a-74ac-ba37-caa3465060f9
  summary: Track extraction unknowns with the same rigor as known elements
  rationale: 'Fabric MUST represent gaps explicitly so consumers can trust query results
    and

    prioritize extractor work. Rejected alternatives: heuristic inference (hides

    uncertainty), omitting elements (loses partial knowledge), vague low-confidence
    flags

    (not actionable).

    '
  alternatives_considered:
  - name: Heuristic inference for gaps
    rejected_because: 'Produces false positives and indistinguishable provenance versus
      deterministic extraction.

      '
  - name: Omit elements when extraction is incomplete
    rejected_because: 'Loses partial information and visibility into gaps.

      '
  - name: Whole-slice low-confidence flag only
    rejected_because: 'Too coarse to query, assert against, or prioritize fixes.

      '
  consequences:
    positive:
    - Honest, queryable representation of limits
    negative:
    - Incomplete graphs and user education burden
  alias_id: DEC-0601
  alias_name: track-extraction-unknowns-with-the-same-rigor-as-known-elements
- id: 01a04e96-1f5a-7afd-a307-9540c9e29811
  summary: Use categorized unknown records attached to slices
  rationale: 'Unknowns SHOULD carry a stable category (e.g. opaque boundary, unsupported
    language,

    incomplete extraction, manual assertion needed) and descriptive context so reporting

    and APIs can filter and aggregate. Operational surfaces (HTTP APIs, event feeds)
    are

    implementation details outside this ADR-L.

    '
  consequences:
    positive:
    - Gap visibility drives extractor prioritization
    negative:
    - Requires consistent category vocabulary maintenance
  alias_id: DEC-0602
  alias_name: use-categorized-unknown-records-attached-to-slices
invariants:
- id: 01a04e96-1f5a-7bee-9e3f-297bb092c614
  statement: 'When extraction cannot determine a relationship or property that belongs
    in the slice

    model, the system MUST record an explicit unknown rather than inventing a definitive

    edge or attribute from heuristics alone.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves honesty and aligns with ADR-L-0001 prohibition on probabilistic
    graph assertions.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-74ac-ba37-caa3465060f9
  alias_id: INV-0601
  alias_name: inv-0601
- id: 01a04e96-1f5a-79db-8311-41a81310d983
  statement: 'Unknowns MUST be first-order records in the slice documentation contract
    (queryable and

    attributable), not only log lines or informal notes.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'Ensures unknowns are visible to APIs, audits, and humans—not buried
    in logs.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-74ac-ba37-caa3465060f9
  - 01a04e96-1f5a-7afd-a307-9540c9e29811
  alias_id: INV-0602
  alias_name: inv-0602
gaps:
- id: GAP-0601
  question: Normative machine schema for unknown records in Architecture IR
  impact: medium
  blocking: false
- id: GAP-0602
  question: Cross-link to ADR-L-0009 when assertion precedence is machine-encoded
  impact: low
  blocking: false
