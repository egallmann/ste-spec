decisions:
- id: 01a04e96-1f5a-7b2e-b837-48ca2a0680b1
  summary: Define slice correctness as faithful reflection of source artifacts at
    a version
  rationale: 'Correctness ties to deterministic extraction, provenance, and validation
    practices;

    runtime behavior parity and guaranteed completeness are out of scope for extraction

    truth claims.

    '
  consequences:
    positive:
    - Clear expectations for trust in extracted slices
    negative:
    - Users must treat unknowns and limits explicitly
  alias_id: DEC-0801
  alias_name: define-slice-correctness-as-faithful-reflection-of-source-artifacts-at-a-version
- id: 01a04e96-1f5a-7390-9c2d-32da0589f89c
  summary: Adopt eventual consistency with version- and environment-scoped reads
  rationale: 'Queries are consistent within a declared version snapshot after extraction
    completes

    for that version; environment queries follow last completed extraction; cross-region

    reads may lag within bounded windows; no read-your-writes guarantee immediately
    after

    triggering extraction.

    '
  consequences:
    positive:
    - Matches common distributed storage patterns for documentation use cases
    negative:
    - Clients must wait on completion signals for freshness
  alias_id: DEC-0802
  alias_name: adopt-eventual-consistency-with-version-and-environment-scoped-reads
- id: 01a04e96-1f5a-7481-9423-6bf626cacb83
  summary: Isolate partial extraction failures per artifact with explicit partial
    status
  rationale: 'Successful files produce slices; failures are recorded with unknowns
    and diagnostics;

    completion signals report partial status rather than failing the whole repository

    silently.

    '
  consequences:
    positive:
    - Partial value delivery with transparent gaps
    negative:
    - Clients must handle partial graphs
  alias_id: DEC-0803
  alias_name: isolate-partial-extraction-failures-per-artifact-with-explicit-partial-status
- id: 01a04e96-1f5a-7526-a93f-48bdd3063ece
  summary: Use last-completed job wins for overlapping reconciliations with immutable
    versions
  rationale: 'Concurrent jobs are allowed; slice versions are immutable; current pointers
    advance to

    the latest completed job per environment with auditable job metadata.

    '
  consequences:
    positive:
    - Simple operational model without distributed locks
    negative:
    - Rare counterintuitive ordering when long jobs overlap short jobs
  alias_id: DEC-0804
  alias_name: use-last-completed-job-wins-for-overlapping-reconciliations-with-immutable-versions
- id: 01a04e96-1f5a-7102-be3b-c726b49d5244
  summary: Store extracted and asserted facts with provenance; surface conflicts without
    automatic override
  rationale: 'Neither source automatically wins; queries can filter by provenance;
    conflicts are

    visible for human resolution (detailed precedence may be extended by ADR-L-0009).

    '
  consequences:
    positive:
    - Preserves human domain knowledge alongside extraction
    negative:
    - Manual resolution burden when conflicts exist
  alias_id: DEC-0805
  alias_name: store-extracted-and-asserted-facts-with-provenance-surface-conflicts-without-automatic-override
- id: 01a04e96-1f5a-7f90-b30d-39b5dcb7ec7f
  summary: Multi-region active-active with bounded replication lag
  rationale: 'Regional reads may be briefly stale; last-writer-wins applies to rare
    conflicts;

    acceptable for documentation-state availability trade-offs.

    '
  consequences:
    positive:
    - High availability
    negative:
    - Visible transient divergence across regions
  alias_id: DEC-0806
  alias_name: multi-region-active-active-with-bounded-replication-lag
invariants:
- id: 01a04e96-1f5a-70f1-920d-fb6ab6c21dda
  statement: 'Partial extraction MUST NOT silently drop successful slices; failures
    MUST be

    visible via partial status, unknowns, or equivalent documented signals.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Prevents silent data loss and aligns partial failure semantics with
    ADR-L-0006.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7481-9423-6bf626cacb83
  alias_id: INV-0801
  alias_name: inv-0801
- id: 01a04e96-1f5a-7770-833e-0d1f60bbf600
  statement: 'Query responses that combine extracted and asserted facts MUST retain
    provenance

    sufficient to filter or explain conflicts unless a superseding ADR-L defines

    automatic precedence.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'Preserves trust and debuggability when human and extractor knowledge
    diverge.

    '
  upheld_by_decisions:
  - 01a04e96-1f5a-7102-be3b-c726b49d5244
  alias_id: INV-0802
  alias_name: inv-0802
