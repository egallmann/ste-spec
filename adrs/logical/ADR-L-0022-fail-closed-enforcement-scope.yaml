schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5b-74cc-9a3d-921d80842047
title: Fail-Closed Semantics and Enforcement Scope
status: accepted
created_date: '2025-12-23'
modified_date: '2026-03-29'
authors:
- Erik Gallmann
- ste-spec
domains:
- gateway
- enforcement
tags:
- fail-closed
- enforcement
context: 'Authoritative execution eligibility and canonical promotion require complete,
  successful

  validation. Fail-closed halts authoritative actions when prerequisites cannot be
  verified;

  it does not require total system unavailability. Non-authoritative inspection may
  continue

  under explicit degraded labeling.


  Legacy: `adrs/published/ADR-022-fail-closed-enforcement-scope.md`.


  **Reconciliation vs ADR-L-100x:** **coexist-with-precedence** — **ADR-L-1009** defines
  the

  kernel decision contract; this ADR defines STE-system-wide fail-closed triggers
  and

  non-bypass rules at the Gateway / promotion boundary.

  '
related_adrs:
- 01a04e96-1f5a-7af0-a138-a306f7b93157
- 01a04e96-1f5a-720a-bc3f-d1ce4bde0816
- 01a04e96-1f5b-7a30-ad3e-e3e11989eed7
- 01a04e96-1f5b-788c-8306-d10c9fe24eaa
- 01a04e96-1f5d-7793-873c-136f29f470be
decisions:
- id: 01a04e96-1f5b-7362-851b-b54822de262c
  summary: Apply fail-closed to execution eligibility and canonical promotion when
    validation is incomplete, failed, or indeterminate
  rationale: 'Partial or best-effort validation would undermine determinism and authority
    scarcity;

    authoritative actions require full verification.

    '
  consequences:
    positive:
    - Unambiguous correctness boundary
    negative:
    - Stricter availability coupling for authoritative paths
  alias_id: DEC-2201
  alias_name: fail-closed-execution-eligibility
- id: 01a04e96-1f5b-7408-bc3c-a3dadaff7018
  summary: Prohibit bypass of fail-closed via operator override, emergency modes,
    environment-specific relaxation, or best-effort execution
  rationale: 'Any bypass introduces implicit trust and non-deterministic enforcement.

    '
  consequences:
    positive:
    - No hidden weakening of guarantees
    negative:
    - No discretionary override at the enforcement boundary
  alias_id: DEC-2202
  alias_name: fail-closed-bypass-prohibition
- id: 01a04e96-1f5b-7b7d-bd3f-174dc25f2b40
  summary: Allow read-only inspection under fail-closed only when outputs are explicitly
    non-authoritative and audit-logged
  rationale: 'Operators need diagnostics without granting execution or promotion.

    '
  consequences:
    positive:
    - Debuggability without correctness compromise
    negative:
    - Requires clear degraded signaling in implementations
  alias_id: DEC-2203
  alias_name: fail-closed-read-only-inspection
invariants:
- id: 01a04e96-1f5b-7594-b03f-c7fd665334c9
  statement: 'If any prerequisite for execution eligibility or canonical promotion
    cannot be fully

    validated, the implementation MUST deny the authoritative action (fail closed).

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Matches eligibility and promotion algorithms that treat indeterminacy
    as denial.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7362-851b-b54822de262c
  alias_id: INV-2201
  alias_name: inv-2201
- id: 01a04e96-1f5b-7e02-823f-35b65cfdf09d
  statement: 'Read-only evaluation paths used while fail-closed is active MUST NOT
    approve execution

    eligibility or canonical promotion and MUST surface degraded, non-authoritative
    status.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Prevents inspection modes from becoming shadow approval channels.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7b7d-bd3f-174dc25f2b40
  alias_id: INV-2202
  alias_name: inv-2202
gaps:
- id: GAP-2201
  question: Operational SLAs and retry semantics remain out of band for this ADR-L
  impact: low
  blocking: false
