schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5d-7300-b13f-588156097d46
title: Decision Outcome Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
tags:
- outcomes
- allow
- deny
context: 'Caller-facing admission emits a small set of canonical outcomes. Each outcome
  carries

  meaning for whether the **requested action** may execute, what remediation is required,

  and how warnings differ from hard gates.


  This model aligns with ADR-031: only ste-kernel emits caller-facing admission

  semantics; ste-runtime remains evidence-only.

  '
decisions:
- id: 01a04e96-1f5d-7a8f-a93d-759244ff601d
  summary: Define ALLOW, DENY, CONDITIONAL, WARNING semantics for requested_action
  rationale: 'Shared vocabulary prevents incompatible client interpretations.

    '
  alias_id: DEC-6871
  alias_name: define-allow-deny-conditional-warning-semantics-for-requested-action
- id: 01a04e96-1f5d-760e-ab27-013de298ba9a
  summary: Bind execution permission to outcome and action class jointly
  rationale: 'Some informational actions never imply execution permission changes.

    '
  alias_id: DEC-6872
  alias_name: bind-execution-permission-to-outcome-and-action-class-jointly
related_adrs:
- 01a04e96-1f5c-7eef-9c36-e3ff0be7a77d
- 01a04e96-1f5c-73c9-ad1f-df05ef43cae1
- 01a04e96-1f5d-7793-873c-136f29f470be
invariants:
- id: 01a04e96-1f5d-7b84-891b-a39e05101a84
  statement: 'DENY MUST prohibit execution of the requested_action; ALLOW MUST explicitly
    clear the

    action subject to downstream enforcement surfaces; CONDITIONAL MUST require documented

    preconditions before execution; WARNING MUST surface non-blocking findings without

    implying allow unless paired with ALLOW or CONDITIONAL clearance.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Clients must interpret outcomes consistently for the same requested_action
    semantics.

    '
  alias_id: INV-5071
  alias_name: inv-5071
gaps: []
alias_id: ADR-L-1008
alias_name: decision-outcome-model
