schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5c-70ba-9337-084a88667cc5
title: Architecture Freshness Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
- evidence
tags:
- freshness
- staleness
context: 'Freshness distinguishes whether integration-state (Architecture IR) and
  observational

  state (evidence) are current enough for the decision at hand. IR freshness and evidence

  freshness are distinct signals and MUST NOT be conflated.


  Failure modes MUST align with ADR-031 and `execution/STE-Kernel-Execution-Model.md`:

  invalid IR blocks boot; admission operates only on validated IR projections.

  '
decisions:
- id: 01a04e96-1f5c-7dba-9c3f-4c50ed20c164
  summary: Define IR invalid as boot failure preventing operational kernel use
  rationale: 'Unvalidated IR cannot be a trustworthy substrate for admission or orchestration.

    '
  alias_id: DEC-6431
  alias_name: define-ir-invalid-as-boot-failure-preventing-operational-kernel-use
- id: 01a04e96-1f5c-7e44-b92e-00b4597c4b7c
  summary: Map IR stale to CONDITIONAL or DENY per posture and rules
  rationale: 'Stale declared architecture may still be structurally valid but untrustworthy
    for action.

    '
  alias_id: DEC-6432
  alias_name: map-ir-stale-to-conditional-or-deny-per-posture-and-rules
- id: 01a04e96-1f5c-708e-ab0f-f71a9adad3ab
  summary: Map evidence stale to WARNING or CONDITIONAL default bands
  rationale: 'Evidence lag may warn or gate without necessarily invalidating IR structure.

    '
  alias_id: DEC-6433
  alias_name: map-evidence-stale-to-warning-or-conditional-default-bands
- id: 01a04e96-1f5c-7be6-891f-a440906c1126
  summary: Map evidence missing to CONDITIONAL or DENY per required evidence classes
  rationale: 'Missing required observations cannot be treated as silent assent.

    '
  alias_id: DEC-6434
  alias_name: map-evidence-missing-to-conditional-or-deny-per-required-evidence-classes
- id: 01a04e96-1f5c-7dac-b63e-cc26f29a5f4f
  summary: Treat IR and evidence mismatch as drift classification input
  rationale: 'Mismatch is not resolved by picking a winner; it is classified per ADR-L-1005.

    '
  alias_id: DEC-6435
  alias_name: treat-ir-and-evidence-mismatch-as-drift-classification-input
related_adrs:
- 01a04e96-1f5c-73c9-ad1f-df05ef43cae1
- 01a04e96-1f5c-7b1e-943d-6db525f77bf0
- 01a04e96-1f5d-7793-873c-136f29f470be
invariants:
- id: 01a04e96-1f5c-79fa-b53d-d2af75e525c3
  statement: 'IR validation failure MUST surface as boot/integration failure, not
    as a successful

    admission ALLOW outcome.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Matches STE kernel execution model: invalid IR cannot underpin successful
    admission.

    '
  alias_id: INV-5031
  alias_name: inv-5031
- id: 01a04e96-1f5c-7ecc-be35-762ba64080ba
  statement: 'Freshness interpretations for identical inputs MUST be stable for deterministic
    replay

    of admission outcomes.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'Deterministic replay and audit require stable freshness classification
    for identical inputs.

    '
  alias_id: INV-5032
  alias_name: inv-5032
gaps:
- id: GAP-5031
  question: Required evidence classes per action and environment
  impact: high
  blocking: false
alias_id: ADR-L-1004
alias_name: architecture-freshness-model
