context: 'Non-overlapping compiler roles: **adr-architecture-kit** is the authoring
  compiler for

  ADR registries/manifest/rendered views (not a second compiler-of-record for

  `ArchitectureEvidence` or normative `Compiled_IR_Document`). **ste-runtime** is
  runtime

  evidence compiler of record. **ste-kernel** merges publication fragments, validates
  IR,

  and emits `KernelAdmissionAssessment` while consuming ste-spec contracts.


  Legacy: `adrs/published/ADR-041-compiler-and-merge-authority.md`.


  **Reconciliation vs ADR-L-1004:** **coexist-with-precedence** — freshness semantics
  govern

  evidence timing; this ADR assigns **who may compile** named artifact families.


  **Reconciliation vs ADR-L-1005:** **coexist-with-precedence** — drift detection
  consumes

  compiled views; compiler-of-record boundaries prevent ambiguous duplicate compile
  stacks.


  **Runtime compiler of record:** **ste-runtime** `COMPILER-AUTHORITY.md` — use

  `ste architecture compile --project-root <repo-root>` (see **MIGRATION-INVENTORY.md**
  Phase 5

  for a recorded example command and artifact paths).

  '
