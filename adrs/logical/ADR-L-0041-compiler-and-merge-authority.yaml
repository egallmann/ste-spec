decisions:
- id: 01a04e96-1f5c-7b65-803f-d2016b02ce66
  summary: Assign authoring-time ADR compilation to adr-architecture-kit without claiming
    runtime ArchitectureEvidence or normative Compiled_IR_Document compiler-of-record
    roles
  rationale: 'Prevents parallel truth compilers for the same interchange contracts.

    '
  consequences:
    positive:
    - Clear golden parity versus production compile paths
    negative:
    - Contributors must use the right tool per task
  alias_id: DEC-4101
  alias_name: authoring-time-adr-compilation
- id: 01a04e96-1f5c-7a31-aa3f-53438d0c8225
  summary: Assign ArchitectureEvidence compilation to ste-runtime; assign IR merge,
    validation, and admission assessment emission to ste-kernel
  rationale: 'Keeps evidence factual and kernel decision-bearing per ADR-L-0031.

    '
  consequences:
    positive:
    - Aligns repos with Spine enforcement story
    negative:
    - Documentation must stay synchronized across three repos
  alias_id: DEC-4102
  alias_name: evidence-kernel-admission-authority
invariants:
- id: 01a04e96-1f5c-7083-a03e-3069ae14e755
  statement: 'Repositories MUST NOT maintain a second authoritative compile path that
    redefines ste-spec

    contract shapes for `ArchitectureEvidence` or normative Architecture IR schema
    without an

    explicit superseding ADR-L.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves single normative shape targets for fail-closed enforcement.

    '
