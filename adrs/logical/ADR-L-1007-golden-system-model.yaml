schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5d-7507-ba3f-41979e12af8f
title: Golden System Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
tags:
- golden
- promotion
context: 'A Golden system is a designated reference or production-grade posture with
  stricter

  eligibility, evidence, and promotion gates. Golden status is not merely descriptive;

  it changes what future promotions and dependent systems may assume.


  Promotion to Golden MUST be auditable and MUST bind to explicit authority (human

  governance decision and/or deterministic automated gates declared in policy), not
  to

  informal convention.

  '
decisions:
- id: 01a04e96-1f5d-7159-991f-8adaf86a4158
  summary: Define Golden eligibility prerequisites
  rationale: 'Golden without criteria becomes a hollow label.

    '
  alias_id: DEC-6761
  alias_name: define-golden-eligibility-prerequisites
- id: 01a04e96-1f5d-7277-be37-f79241a3d199
  summary: Define who or what may promote to Golden
  rationale: 'Separates governance authority from tooling automation boundaries.

    '
  alias_id: DEC-6762
  alias_name: define-who-or-what-may-promote-to-golden
- id: 01a04e96-1f5d-79a4-9539-309865a57e9b
  summary: State implications for downstream systems and templates
  rationale: 'Golden systems act as reference baselines for stricter inheritance or
    copying rules.

    '
  alias_id: DEC-6763
  alias_name: state-implications-for-downstream-systems-and-templates
