decisions:
- id: 01a04e96-1f5b-7eef-8d2f-07a39f5cfc6a
  summary: Require closed-object discipline for encoded handoff payloads at the runtime/kernel
    boundary
  rationale: 'Bounded objects force explicit contract evolution and deterministic
    rejection of drift.

    '
  consequences:
    positive:
    - Deterministic producer/consumer conformance
    negative:
    - Extension requires spec revision
  alias_id: DEC-3301
  alias_name: require-closed-object-discipline-for-encoded-handoff-payloads-at-the-runtime-kernel-boundary
invariants:
- id: 01a04e96-1f5b-746b-ac2f-1bb3fc19ee2c
  statement: 'Ad hoc extension fields on closed handoff objects MUST NOT be treated
    as contract-valid

    without an explicit ste-spec contract and invariant update.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Prevents silent semantic extension.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7eef-8d2f-07a39f5cfc6a
