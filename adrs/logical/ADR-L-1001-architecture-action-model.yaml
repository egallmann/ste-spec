schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5c-7eef-9c36-e3ff0be7a77d
title: Architecture Action Model
status: proposed
created_date: '2026-03-28'
authors:
- ste-spec
domains:
- governance
- kernel
- admission
tags:
- action-model
- admission
- kernel
context: 'The kernel does not admit or deny systems in the abstract. Caller-facing
  admission

  evaluates whether a **requested action** on a system (in an explicit environment
  and

  evaluation scope) is allowed, denied, conditional, or warned under declared architecture,

  evidence, posture, and rules.


  This ADR-L defines the canonical **action vocabulary** and which actions participate
  in

  admission versus informational-only evaluation. It aligns with **ADR-L-0031** (kernel
  as

  admission authority), **ADR-L-0040** (Spine lifecycle), and `execution/STE-Kernel-Execution-Model.md`

  (boot versus admission phases).

  '
related_adrs:
- 01a04e96-1f5b-7c56-bc3f-75fbbc94d42b
- 01a04e96-1f5c-78e0-823f-3c915d07acd6
- 01a04e96-1f5c-73c9-ad1f-df05ef43cae1
- 01a04e96-1f5d-7793-873c-136f29f470be
decisions:
- id: 01a04e96-1f5c-7b1e-983a-299a24ca9edd
  summary: Define canonical requested-action verbs for kernel evaluation
  rationale: 'Without a closed vocabulary, tools and policies cannot classify what
    is being

    evaluated or map outcomes deterministically.

    '
  consequences:
    positive:
    - Shared semantics across repositories and assistants
    negative:
    - New verbs require ADR-L revision or explicit extension rules
  alias_id: DEC-6101
  alias_name: define-canonical-requested-action-verbs-for-kernel-evaluation
- id: 01a04e96-1f5c-7088-813f-d682a21ed5e1
  summary: Require every admission decision to name a requested action in context
  rationale: 'Admission without an action is undefined; context (system instance,
    environment,

    scope) is part of the decision input closure.

    '
  alias_id: DEC-6102
  alias_name: require-every-admission-decision-to-name-a-requested-action-in-context
- id: 01a04e96-1f5c-739a-9f2f-8e770b0af13e
  summary: Classify assess as informational for admission authority
  rationale: 'Assessment and reporting must not be conflated with allow/deny for operational
    actions;

    see ste-kernel ADR-PS for the assessment pipeline boundary.

    '
  alias_id: DEC-6103
  alias_name: classify-assess-as-informational-for-admission-authority
- id: 01a04e96-1f5c-74cb-9331-6789dec581f6
  summary: Enumerate canonical requested actions for kernel evaluation
  rationale: 'Provides a minimal closed verb set; extensions require explicit documentation.

    '
  consequences:
    positive:
    - Deterministic policy mapping per action category
    negative:
    - New verbs need governance updates
  alias_id: DEC-6104
  alias_name: enumerate-canonical-requested-actions-for-kernel-evaluation
invariants:
- id: 01a04e96-1f5c-7305-af3f-f7c4f10ea54a
  statement: 'Admission evaluation MUST identify a requested_action from the canonical
    vocabulary

    (design, change, build, deploy, operate, assess, promote) or an explicitly documented

    extension; omission MUST be treated as invalid input per the Kernel Decision Contract

    fail-closed rules.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Without a named action, admission cannot be deterministic or explainable
    per ADR-L-1009.

    '
  alias_id: INV-5001
  alias_name: inv-5001
- id: 01a04e96-1f5c-7434-853e-b563bb747c3e
  statement: 'Informational-only actions MUST NOT emit caller-facing allow/deny semantics
    at the

    admission boundary; they MAY produce reports, findings, and explanations only.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'Prevents assessment outputs from being mistaken for admission authority
    at the kernel boundary.

    '
  alias_id: INV-5002
  alias_name: inv-5002
- id: 01a04e96-1f5c-7b2c-af2d-a5bbefb108f5
  statement: 'Actions design, change, build, deploy, operate, and promote are subject
    to admission

    decisions unless explicitly routed to assessment-only mode; assess is informational

    for admission authority and MUST use the assessment pipeline outputs instead of

    admission allow/deny semantics.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: manual
  rationale: 'Separates operational gating from informational evaluation per ADR-L-1002
    and ste-kernel ADR-PS assessment pipeline.

    '
  alias_id: INV-5003
  alias_name: inv-5003
gaps:
- id: GAP-5001
  question: Formal machine encoding of action payloads and extension registration
  impact: medium
  blocking: false
alias_id: ADR-L-1001
alias_name: architecture-action-model
