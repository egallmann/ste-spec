decisions:
- id: 01a04e96-1f5b-7ded-b337-01c79d48c692
  summary: Govern cross-repository handoff contract shape in ste-spec `contracts/`
    and rules in `invariants/`
  rationale: 'Single normative source for payload structure, semantic rules, and architectural
    intent

    at the runtime/kernel boundary.

    '
  consequences:
    positive:
    - No parallel shadow contract authority in consumer repos
    negative:
    - Contract evolution requires coordinated ste-spec changes
  alias_id: DEC-3001
  alias_name: govern-cross-repository-handoff-contract-shape-in-ste-spec-contracts-and-rules-in-invariants
invariants:
- id: 01a04e96-1f5b-7c87-8a1f-093dbd20805a
  statement: 'Runtime and kernel repositories MUST NOT treat repo-local types, tests,
    or informal

    prose as authoritative over ste-spec `contracts/` and published invariants for
    the

    same handoff surfaces.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Preserves ADR-L-0030 as the contract authority anchor.

    '
  upheld_by_decisions:
  - 01a04e96-1f5b-7ded-b337-01c79d48c692
  alias_id: INV-3001
  alias_name: inv-3001
gaps:
