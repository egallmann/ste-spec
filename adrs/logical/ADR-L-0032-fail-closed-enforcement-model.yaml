context: 'Invalid, unavailable, malformed, or semantically inconsistent runtime evidence
  and

  related publication inputs are fail-closed at the **kernel** boundary before permissive

  admission outcomes. Schema validity alone is insufficient for conformance.


  Legacy: `adrs/published/ADR-032-fail-closed-enforcement-model.md`.


  **Reconciliation vs ADR-L-1009:** **merge** — **ADR-L-1009** states determinism
  and

  fail-closed kernel decision contracts; this ADR applies the same posture specifically
  to

  **runtime evidence and publication inputs** at merge/admission.


  **Reconciliation vs ADR-L-0022:** **coexist-with-precedence** — ADR-L-0022 defines
  STE

  Gateway and promotion fail-closed triggers in the broader STE-System model; this
  ADR

  governs the **kernel documentation-state / IR** enforcement chain.

  '
