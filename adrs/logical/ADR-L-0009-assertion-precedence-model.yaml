schema_version: '1.3'
adr_type: logical
id: 01a04e96-1f5a-70b0-a91f-0d25282f542c
title: Assertion Precedence Model
status: accepted
created_date: '2025-12-19'
modified_date: '2026-03-29'
authors:
- Erik Gallmann
- ste-spec
domains:
- documentation-state
- extraction
- queries
tags:
- assertions
- provenance
- conflicts
context: 'Manual assertions and deterministic extraction can describe the same elements.
  The model

  preserves both with provenance, surfaces contradictions, requires evidence for human

  claims, and supports time-bounded validity.


  Legacy: `adrs/published/ADR-009-assertion-precedence-model.md`.


  **Reconciliation vs ADR-L-100x:** **coexist-with-precedence** — refines provenance
  and

  conflict surfacing for Fabric queries (**ADR-L-0008**); kernel admission contracts

  (**ADR-L-1002**, **ADR-L-1009**) govern the kernel boundary when both apply.

  '
related_adrs:
- 01a04e96-1f5a-73a4-8e3f-bef43b56c052
- 01a04e96-1f5a-7a29-b11e-4fe242be290c
